<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Post Chat Assistent</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ============================= -->
    <!--        POST CHAT STYLES       -->
    <!-- ============================= -->
    <style>
      :root {
        --post-yellow: #ffcc00;
        --post-dark: #111111;
        --post-border: #e5e5e5;
        --post-bg: #ffffff;
        --post-bg-alt: #fffaf0;
        --post-radius-xl: 18px;
        --post-shadow-soft: 0 16px 40px rgba(0, 0, 0, 0.12);
      }

      body {
        font-family: Arial, sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
      }

      /* Floating Toggle Button */
      .post-chat-toggle-btn {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 56px;
        height: 56px;
        border-radius: 999px;
        border: none;
        background: var(--post-yellow);
        color: var(--post-dark);
        font-size: 24px;
        box-shadow: var(--post-shadow-soft);
        cursor: pointer;
        z-index: 9999;
      }

      /* Overlay */
      .post-chat-overlay {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 380px;
        max-width: 100vw;
        height: 80vh;
        max-height: 640px;
        background: var(--post-bg);
        border-radius: var(--post-radius-xl);
        box-shadow: var(--post-shadow-soft);
        display: flex;
        flex-direction: column;
        border: 1px solid var(--post-border);
        overflow: hidden;
        z-index: 10000;
      }

      /* Header */
      .post-chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--post-border);
        background: linear-gradient(
          to right,
          rgba(255, 204, 0, 0.1),
          rgba(255, 255, 255, 0.9)
        );
      }

      .post-chat-header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .post-logo-badge {
        width: 32px;
        height: 32px;
        border-radius: 999px;
        background: var(--post-yellow);
        color: var(--post-dark);
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .post-chat-titles {
        display: flex;
        flex-direction: column;
      }

      .post-chat-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--post-dark);
      }

      .post-chat-subtitle {
        font-size: 11px;
        color: #555555;
      }

      .post-chat-header-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .post-chat-language-select {
        font-size: 12px;
        padding: 4px 6px;
        border-radius: 999px;
        border: 1px solid var(--post-border);
        background: #ffffff;
      }

      .post-chat-mic-btn {
        width: 32px;
        height: 32px;
        border-radius: 999px;
        border: none;
        font-size: 18px;
        cursor: pointer;
        background: var(--post-dark);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .post-chat-mic-off {
        background: #a00000;
      }

      .post-chat-tts-btn {
        width: 32px;
        height: 32px;
        border-radius: 999px;
        border: none;
        font-size: 18px;
        cursor: pointer;
        background: #f5f5f5;
      }

      .post-chat-tts-btn.on {
        background: var(--post-yellow);
      }

      .post-chat-close-btn {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        background: transparent;
        font-size: 14px;
      }

      .post-chat-flow-bar {
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--post-border);
        background: var(--post-bg-alt);
      }

      .post-chat-flow-btn {
        border-radius: 999px;
        border: none;
        padding: 6px 10px;
        font-size: 11px;
        cursor: pointer;
        background: #ffffff;
        border: 1px solid var(--post-yellow);
      }

      .post-chat-messages {
        flex: 1;
        padding: 8px 12px;
        overflow-y: auto;
        background: #ffffff;
      }

      .post-chat-message {
        display: flex;
        margin-bottom: 8px;
        max-width: 90%;
      }

      .post-chat-message-user {
        justify-content: flex-end;
        margin-left: auto;
      }

      .post-chat-message-assistant {
        justify-content: flex-start;
      }

      .post-chat-avatar {
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: var(--post-yellow);
        color: var(--post-dark);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 6px;
        margin-top: 2px;
      }

      .post-chat-bubble {
        padding: 8px 10px;
        border-radius: 14px;
        font-size: 13px;
        line-height: 1.3;
      }

      .post-chat-message-user .post-chat-bubble {
        background: var(--post-yellow);
        color: var(--post-dark);
      }

      .post-chat-message-assistant .post-chat-bubble {
        background: #f3f3f3;
      }

      .post-chat-input-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-top: 1px solid var(--post-border);
        background: #ffffff;
      }

      .post-chat-input {
        flex: 1;
        padding: 8px 10px;
        border-radius: 999px;
        border: 1px solid var(--post-border);
        font-size: 13px;
      }

      .post-chat-send-btn {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        background: var(--post-yellow);
        color: var(--post-dark);
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <!-- Dein bestehendes HTML bleibt oben bestehen -->
    <h1 style="padding: 20px;">Deine Seite + Post Chat Widget</h1>

    <!-- ================================================= -->
    <!--             POST CHAT HTML STRUCTURE              -->
    <!-- ================================================= -->
    <button
      id="post-chat-toggle-btn"
      class="post-chat-toggle-btn"
      aria-label="Chat öffnen"
      style="display:none;"
    >
      💬
    </button>

    <div
      id="post-chat-overlay"
      class="post-chat-overlay"
      style="display:none;"
    >
      <header class="post-chat-header">
        <div class="post-chat-header-left">
          <div class="post-logo-badge">P</div>
          <div class="post-chat-titles">
            <div class="post-chat-title">Post Assistent</div>
            <div class="post-chat-subtitle">
              Hilfe zu Briefen, Paketen & Filialen
            </div>
          </div>
        </div>

        <div class="post-chat-header-right">
          <select
            id="post-chat-language-select"
            class="post-chat-language-select"
          >
            <option value="de">DE</option>
            <option value="fr">FR</option>
            <option value="it">IT</option>
            <option value="en">EN</option>
          </select>

          <button
            id="post-chat-mic-btn"
            class="post-chat-mic-btn post-chat-mic-off"
          >
            🎙̶
          </button>

          <button id="post-chat-tts-btn" class="post-chat-tts-btn on">
            🔊
          </button>

          <button id="post-chat-close-btn" class="post-chat-close-btn">
            ✕
          </button>
        </div>
      </header>

      <div class="post-chat-flow-bar">
        <button id="post-chat-flow-brief" class="post-chat-flow-btn">
          ✉️ Brief versenden
        </button>
      </div>

      <div id="post-chat-messages" class="post-chat-messages"></div>

      <div class="post-chat-input-row">
        <input
          id="post-chat-input"
          class="post-chat-input"
          type="text"
          placeholder="Nachricht an die Post eingeben…"
        />
        <button id="post-chat-send-btn" class="post-chat-send-btn">
          ➤
        </button>
      </div>
    </div>

    <!-- ================================================= -->
    <!--                   POST CHAT JS                    -->
    <!-- ================================================= -->
    <script>
      const POST_FLOW_PROMPTS = {
        brief_versenden: {
          de: "Bitte starte direkt den Workflow „Brief versenden“ mit mir.",
          fr: "Merci de démarrer directement le flux « Envoyer une lettre » avec moi.",
          it: "Per favore avvia direttamente il flusso «Inviare una lettera» con me.",
          en: "Please start the “send letter” workflow with me directly.",
        },
      };

      const POST_SYSTEM_INSTRUCTIONS = {
        de: "Du bist ein Assistent der Schweizerischen Post. Antworte auf Deutsch und hilf bei postalischen Anliegen.",
        fr: "Tu es un assistant de La Poste Suisse. Réponds en français et aide pour les demandes postales.",
        it: "Sei un assistente della Posta Svizzera. Rispondi in italiano e aiuta con le richieste postali.",
        en: "You are an assistant of Swiss Post. Answer in English and help with postal requests.",
      };

      const KEY_MSG = "post_chat_messages_v1";
      const KEY_LANG = "post_chat_language_v1";

      document.addEventListener("DOMContentLoaded", () => {
        const overlay = document.getElementById("post-chat-overlay");
        const toggleBtn = document.getElementById("post-chat-toggle-btn");
        const languageSelect = document.getElementById(
          "post-chat-language-select"
        );
        const micBtn = document.getElementById("post-chat-mic-btn");
        const ttsBtn = document.getElementById("post-chat-tts-btn");
        const closeBtn = document.getElementById("post-chat-close-btn");
        const flowBriefBtn = document.getElementById("post-chat-flow-brief");
        const messagesBox = document.getElementById("post-chat-messages");
        const input = document.getElementById("post-chat-input");
        const sendBtn = document.getElementById("post-chat-send-btn");

        let messages = [];
        let language = "de";
        let micActive = false;
        let recognition = null;
        let sttSupported = true;
        let ttsActive = true;

        // Load memory
        try {
          const sM = localStorage.getItem(KEY_MSG);
          const sL = localStorage.getItem(KEY_LANG);
          if (sL) {
            language = sL;
            languageSelect.value = sL;
          }
          if (sM) {
            messages = JSON.parse(sM);
          } else {
            messages = [
              {
                role: "system",
                content: POST_SYSTEM_INSTRUCTIONS["de"],
              },
            ];
          }
        } catch {}

        renderMessages();
        openOverlay();

        function saveMessages() {
          localStorage.setItem(KEY_MSG, JSON.stringify(messages));
        }

        function saveLanguage() {
          localStorage.setItem(KEY_LANG, language);
        }

        function openOverlay() {
          overlay.style.display = "flex";
          toggleBtn.style.display = "none";
        }

        function closeOverlay() {
          overlay.style.display = "none";
          toggleBtn.style.display = "block";
        }

        toggleBtn.addEventListener("click", openOverlay);
        closeBtn.addEventListener("click", closeOverlay);

        languageSelect.addEventListener("change", () => {
          language = languageSelect.value;
          saveLanguage();
        });

        function renderMessages() {
          messagesBox.innerHTML = "";
          messages.forEach((m) => {
            const div = document.createElement("div");
            div.className = "post-chat-message post-chat-message-" + m.role;

            if (m.role === "assistant") {
              const avatar = document.createElement("div");
              avatar.className = "post-chat-avatar";
              avatar.textContent = "P";
              div.appendChild(avatar);
            }

            const bubble = document.createElement("div");
            bubble.className = "post-chat-bubble";
            bubble.textContent = m.content;
            div.appendChild(bubble);

            messagesBox.appendChild(div);
          });

          messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function addMessage(role, content) {
          messages.push({ role, content });
          saveMessages();
          renderMessages();

          if (role === "assistant" && ttsActive) speak(content);
        }

        async function handleSend(optionalText) {
          const text = optionalText || input.value.trim();
          if (!text) return;
          input.value = "";

          addMessage("user", text);

          // DEMO: ChatKit wird später hier eingebaut
          const response = await mockAssistantResponse(text, language);
          addMessage("assistant", response);
        }

        sendBtn.addEventListener("click", () => handleSend());
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") handleSend();
        });

        flowBriefBtn.addEventListener("click", () => {
          const prompt = POST_FLOW_PROMPTS.brief_versenden[language];
          handleSend(prompt);
        });

        function speak(text) {
          const u = new SpeechSynthesisUtterance(text);
          window.speechSynthesis.speak(u);
        }

        ttsBtn.addEventListener("click", () => {
          ttsActive = !ttsActive;
          ttsBtn.classList.toggle("on", ttsActive);
        });
      });

      // Demo until ChatKit is plugged in
      async function mockAssistantResponse(text, lang) {
        return (
          {
            de: "Dies ist eine Demo-Antwort.",
            fr: "Ceci est une réponse de démonstration.",
            it: "Questa è una risposta di demo.",
            en: "This is a demo answer.",
          }[lang] +
          "\n\nDu hast geschrieben: " +
          text
        );
      }
    </script>
  </body>
</html>
